name: Reproduce aggregate results
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/analysis.txt
      - run: python -m pip install -r requirements/analysis.txt
      - run: python -m compileall -q src tests
      - run: for script in scripts/*/*.sh; do bash -n "$script"; done
      - run: python src/reproduce_results.py
      - run: python -m unittest discover -s tests -p 'test_strict6.py' -v
